services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-v0.0.0-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "8001:8001"
    # The SQLite DB lives at /app/data/telemetry.db (the config.py default
    # resolves there because WORKDIR is /app). Persist it on the host.
    volumes:
      - ./data:/app/data
    restart: unless-stopped