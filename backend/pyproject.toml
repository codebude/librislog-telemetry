[project]
name = "librislog-telemetry-backend"
version = "v0.0.0-dev"
description = "Minimal, open source and transparent telemetry server for librislog"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
    "pytest>=9.1.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::ResourceWarning",
]
addopts = "-ra --cov=app --cov-report term-missing"
